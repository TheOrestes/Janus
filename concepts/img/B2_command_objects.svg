<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270" role="img" aria-label="The three command objects. A command list writes commands into memory owned by a command allocator. A closed list is submitted to the command queue, which hands it to the GPU. The allocator must not be reset until the GPU has finished reading it.">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e5e7eb"/></marker></defs>
<style>
.ttl{font-family:system-ui,sans-serif;font-size:13px;fill:#c7d2fe}
.lbl{font-family:system-ui,sans-serif;font-size:12px;fill:#d1d5db}
.dim{font-family:system-ui,sans-serif;font-size:11px;fill:#9ca3af}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;fill:#e5e7eb}
.red{font-family:system-ui,sans-serif;font-size:12px;fill:#f87171}
</style>
<text class="ttl" x="20" y="24">Three objects, three jobs</text>
<rect x="20" y="52" width="210" height="96" rx="6" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-width="1.4"/>
<text class="mono" x="125" y="80" text-anchor="middle">CommandAllocator</text>
<text class="dim" x="125" y="102" text-anchor="middle">owns the memory</text>
<text class="dim" x="125" y="118" text-anchor="middle">the commands live in</text>
<text class="dim" x="125" y="134" text-anchor="middle">Reset() frees it all at once</text>
<rect x="275" y="52" width="210" height="96" rx="6" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-width="1.4"/>
<text class="mono" x="380" y="80" text-anchor="middle">GraphicsCommandList</text>
<text class="dim" x="380" y="102" text-anchor="middle">the pen: you call Draw,</text>
<text class="dim" x="380" y="118" text-anchor="middle">Clear, ResourceBarrier on it</text>
<text class="dim" x="380" y="134" text-anchor="middle">Close() ends recording</text>
<rect x="530" y="52" width="210" height="96" rx="6" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-width="1.4"/>
<text class="mono" x="635" y="80" text-anchor="middle">CommandQueue</text>
<text class="dim" x="635" y="102" text-anchor="middle">the door to the GPU</text>
<text class="dim" x="635" y="118" text-anchor="middle">ExecuteCommandLists</text>
<text class="dim" x="635" y="134" text-anchor="middle">Signal(fence, value)</text>
<line x1="273" y1="90" x2="232" y2="90" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
<text class="dim" x="252" y="82" text-anchor="middle">writes</text>
<line x1="487" y1="90" x2="528" y2="90" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
<text class="dim" x="508" y="82" text-anchor="middle">submit</text>
<line x1="635" y1="150" x2="635" y2="186" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="560" y="188" width="150" height="34" rx="5" fill="none" stroke="#9ca3af" stroke-width="1.4"/>
<text class="lbl" x="635" y="210" text-anchor="middle">GPU reads the memory</text>
<text class="red" x="20" y="190">Reset the allocator only after the GPU has finished</text>
<text class="red" x="20" y="208">reading what is in it. That is what fences are for.</text>
<text class="dim" x="20" y="250">A list can be Reset() and reused right after submission. The allocator behind it cannot.</text>
</svg>
