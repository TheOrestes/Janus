<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270" role="img" aria-label="Three back buffers rotating roles. In each frame one buffer is on screen, one is ready and waiting, and one is being rendered into. The roles rotate every frame.">
<style>
.ttl{font-family:system-ui,sans-serif;font-size:13px;fill:#c7d2fe}
.lbl{font-family:system-ui,sans-serif;font-size:12px;fill:#d1d5db}
.dim{font-family:system-ui,sans-serif;font-size:11px;fill:#9ca3af}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;fill:#e5e7eb}
</style>
<text class="ttl" x="20" y="24">Three buffers, three roles, rotating</text>
<text class="mono" x="265" y="56" text-anchor="middle">buffer 0</text><text class="mono" x="445" y="56" text-anchor="middle">buffer 1</text><text class="mono" x="625" y="56" text-anchor="middle">buffer 2</text>
<text class="lbl" x="20" y="96">frame k</text><text class="lbl" x="20" y="156">frame k+1</text><text class="lbl" x="20" y="216">frame k+2</text>
<rect x="180" y="70" width="170" height="40" rx="5" fill="#34d399" fill-opacity="0.18" stroke="#34d399" stroke-width="1.4"/><text class="lbl" x="265" y="95" text-anchor="middle">on screen</text>
<rect x="360" y="70" width="170" height="40" rx="5" fill="#9ca3af" fill-opacity="0.12" stroke="#9ca3af" stroke-width="1.4"/><text class="lbl" x="445" y="95" text-anchor="middle">ready, waiting</text>
<rect x="540" y="70" width="170" height="40" rx="5" fill="#fbbf24" fill-opacity="0.18" stroke="#fbbf24" stroke-width="1.4"/><text class="lbl" x="625" y="95" text-anchor="middle">GPU rendering into</text>
<rect x="180" y="130" width="170" height="40" rx="5" fill="#fbbf24" fill-opacity="0.18" stroke="#fbbf24" stroke-width="1.4"/><text class="lbl" x="265" y="155" text-anchor="middle">GPU rendering into</text>
<rect x="360" y="130" width="170" height="40" rx="5" fill="#34d399" fill-opacity="0.18" stroke="#34d399" stroke-width="1.4"/><text class="lbl" x="445" y="155" text-anchor="middle">on screen</text>
<rect x="540" y="130" width="170" height="40" rx="5" fill="#9ca3af" fill-opacity="0.12" stroke="#9ca3af" stroke-width="1.4"/><text class="lbl" x="625" y="155" text-anchor="middle">ready, waiting</text>
<rect x="180" y="190" width="170" height="40" rx="5" fill="#9ca3af" fill-opacity="0.12" stroke="#9ca3af" stroke-width="1.4"/><text class="lbl" x="265" y="215" text-anchor="middle">ready, waiting</text>
<rect x="360" y="190" width="170" height="40" rx="5" fill="#fbbf24" fill-opacity="0.18" stroke="#fbbf24" stroke-width="1.4"/><text class="lbl" x="445" y="215" text-anchor="middle">GPU rendering into</text>
<rect x="540" y="190" width="170" height="40" rx="5" fill="#34d399" fill-opacity="0.18" stroke="#34d399" stroke-width="1.4"/><text class="lbl" x="625" y="215" text-anchor="middle">on screen</text>
<text class="dim" x="20" y="256">Each Present() advances the cycle. GetCurrentBackBufferIndex() tells you which buffer is yours next.</text>
</svg>
